services:
  # Backend Service
  - type: web
    name: shop-management-backend
    env: java
    region: oregon
    plan: free
    buildCommand: cd backend && mvn clean package -DskipTests
    startCommand: cd backend && java -jar target/shop-management-system-1.0.0.jar
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shop-management-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: shop-management-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: shop-management-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JAVA_OPTS
        value: -Xmx512m
    healthCheckPath: /actuator/health

  # Frontend Service
  - type: web
    name: shop-management-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://shop-management-backend.onrender.com/api

# Database
databases:
  - name: shop-management-db
    databaseName: shopmanagement
    user: shopuser
    plan: free
    region: oregon
